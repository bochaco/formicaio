name: Docker images which run native nodes (LCD disabled)

on:
  push:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  extract_version:
    if: "startsWith(github.event.head_commit.message, 'chore: set version to v')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from commit message
        id: get_version
        run: |
          # Get the commit message
          COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          # Extract version tag (assuming the version is in the format "vX.Y.Z")
          VERSION=$(echo "$COMMIT_MESSAGE" | grep -oP 'v\K\d+\.\d+\.\d+$')
          echo "Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build:

    if: "startsWith(github.event.head_commit.message, 'chore: set version to v')"
    needs: extract_version  # Ensure this job runs after the version extraction
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push single-platform image (LCD disabled)
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: bochaco/formicaio-gh:build-native-lcd-disabled-${{ matrix.suffix }}-${{ github.run_id }}
          cache-from: type=gha,scope=native-lcd-disabled-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=native-lcd-disabled-${{ matrix.suffix }}
          build-args: |
            BUILD_ARGS=--features native,lcd-disabled

  publish:

    if: "startsWith(github.event.head_commit.message, 'chore: set version to v')"
    runs-on: ubuntu-latest
    needs: [extract_version, build]

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge per-arch images into multi-platform tag
        run: |
          docker buildx imagetools create \
            -t ${{ vars.DOCKERHUB_USERNAME }}/formicaio:${{ needs.extract_version.outputs.version }}-native-lcd-disabled \
            bochaco/formicaio-gh:build-native-lcd-disabled-amd64-${{ github.run_id }} \
            bochaco/formicaio-gh:build-native-lcd-disabled-arm64-${{ github.run_id }}
